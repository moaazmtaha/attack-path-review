[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-path-review"
version = "0.1.0"
description = "Offline attack-path prioritization and mitigation analysis for user-supplied trust graphs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moaaz Taha", email = "moaaz@moaaztaha.com" }]
keywords = ["cybersecurity", "attack-path", "threat-modeling", "identity-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.scripts]
attack-path-review = "attack_path_review.cli:main"

[project.urls]
Homepage = "https://github.com/moaazmtaha/attack-path-review"
Issues = "https://github.com/moaazmtaha/attack-path-review/issues"

[tool.setuptools.packages.find]
where = ["src"]
